# ─── docker-compose.yml ────────────────────────────────────────────────────────
# Full stack: Laravel (PHP) + Python TA Service + Redis
# Run with:  docker compose up -d
# Stop with: docker compose down

version: "3.9"

services:

  # ── Redis (shared cache between Laravel & Python) ──────────────────────────
  redis:
    image: redis:7-alpine
    container_name: trading_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # ── Python TA Microservice ─────────────────────────────────────────────────
  python-ta:
    build:
      context: ./python-ta-service
      dockerfile: Dockerfile
    container_name: trading_python_ta
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - ./python-ta-service/.env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    volumes:
      # Mount the model files so they persist outside the container
      - ./python-ta-service/trade_model.pkl:/app/trade_model.pkl
      - ./python-ta-service/trade_scaler.pkl:/app/trade_scaler.pkl
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Laravel (PHP) Backend ──────────────────────────────────────────────────
  laravel:
    image: php:8.3-fpm-alpine
    container_name: trading_laravel
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      PYTHON_TA_URL: http://python-ta:8001
    depends_on:
      - redis
      - python-ta
    command: >
      sh -c "
        apk add --no-cache \
          curl zip unzip git sqlite \
          libpng-dev libzip-dev oniguruma-dev icu-dev &&
        docker-php-ext-install pdo pdo_sqlite mbstring zip gd intl pcntl bcmath &&
        php-fpm
      "

  # ── Nginx (serves Laravel & proxies /python/* to Python service) ───────────
  nginx:
    image: nginx:alpine
    container_name: trading_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./docker/ssl:/etc/nginx/ssl          # place your certs here
    depends_on:
      - laravel
      - python-ta

volumes:
  redis_data:
